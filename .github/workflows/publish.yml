name: Publish Package to GitHub Packages

on:
  push:
    branches: [ library ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}
      
      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      
      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.1-SNAPSHOT" >> $GITHUB_ENV
            echo "version=0.0.1-SNAPSHOT" >> $GITHUB_OUTPUT
          fi
      
      - name: Update version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.VERSION }}
      
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.SEBACKEND_ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
